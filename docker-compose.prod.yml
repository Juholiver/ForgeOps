# Production overlay — usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.prod up -d
# Requires Docker Compose v2.24.4+ (!override tag)
#
# Caddy terminates TLS for $DOMAIN and reverse-proxies to the nginx container,
# which serves the SPA and forwards /api to the backend service
# (`backend:8000`) on the shared `forgeops` network.

services:
  frontend:
    ports: !override []
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required (e.g. forgeops.duckdns.org)}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    restart: unless-stopped
    networks:
      - forgeops

volumes:
  caddy_data:
  caddy_config:
